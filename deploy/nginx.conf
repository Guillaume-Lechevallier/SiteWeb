server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/health {
        proxy_pass http://cv-api:5000/health;
    }

    location = /api/sendmail {
        client_max_body_size 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 50s;
        proxy_pass http://cv-api:5000/sendmail;
    }
}
