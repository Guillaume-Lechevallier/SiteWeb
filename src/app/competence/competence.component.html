<div class="skills-section" *ngFor="let category of categories">
  <div class="skills-heading-wrap">
    <h3 class="skills-heading">{{ category.name }}</h3>
    <p class="skills-category-description">{{ category.description }}</p>
  </div>
  <div class="skills-grid">
    <article class="skill-card" *ngFor="let skill of category.skills">
      <img class="skill-logo" [src]="skill.logo" [alt]="skill.name" loading="lazy" decoding="async">
      <div class="skill-copy">
        <h4>{{ skill.name }}</h4>
        <p>{{ skill.description }}</p>
      </div>
    </article>
  </div>
</div>
